services:
  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI -- http://localhost:15672, guest/guest

  producer:
    build:
      context: ./src
      dockerfile: EventPipeline.Producer/Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    command: ["--count=30"]

  consumer:
    build:
      context: ./src
      dockerfile: EventPipeline.Consumer/Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - IDEMPOTENCY_DB_PATH=/data/idempotency.db
    volumes:
      - consumer-data:/data
    depends_on:
      - rabbitmq

volumes:
  consumer-data:
